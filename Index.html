<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Matrix Grid</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000000; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; }
        #terminal-hud { position: absolute; bottom: 15px; left: 15px; z-index: 10; border: 1px solid rgba(0, 255, 102, 0.3); background: rgba(0, 0, 0, 0.75); padding: 10px; border-radius: 4px; max-width: calc(100% - 30px); width: calc(100% - 30px); pointer-events: none; }
        .hud-grid { display: flex; flex-direction: column; gap: 4px; }
        @media (min-width: 600px) { .hud-grid { flex-direction: row; flex-wrap: wrap; justify-content: space-between; } }
        .hud-line { color: #00ff66; font-size: 10px; letter-spacing: 1px; white-space: nowrap; text-shadow: 0 0 3px rgba(0, 255, 102, 0.3); }
        .hud-accent { color: #ffffff; }
    </style>
</head>
<body>
    <div id="terminal-hud">
        <div class="hud-grid">
            <div class="hud-line">SYS: <span class="hud-accent">NEBULA</span> // <span class="hud-accent">Killin1t</span></div>
            <div class="hud-line">MATRIX: <span class="hud-accent">FLUID DYNAMICS ENGINE</span></div>
            <div class="hud-line">TUNING: <span class="hud-accent">221.23Hz | 432Hz | 7.83Hz</span></div>
        </div>
    </div>
    <div id="canvas-container"><canvas id="matrix-canvas"></canvas></div>
    <script>
        const canvas = document.getElementById('matrix-canvas'), ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        const particleCount = 280, particles = [];
        for (let i = 0; i < particleCount; i++) { particles.push({ vectorGroup: i % 18, seed: i, phase: Math.random() * Math.PI * 2 }); }
        let rotationY = 0, isDragging = false, startX = 0;
        window.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; });
        window.addEventListener('mousemove', (e) => { if (isDragging) { rotationY += (e.clientX - startX) * 0.004; startX = e.clientX; } });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchstart', (e) => { isDragging = true; startX = e.touches[0].clientX; });
        window.addEventListener('touchmove', (e) => { if (isDragging) { rotationY += (e.touches[0].clientX - startX) * 0.004; startX = e.touches[0].clientX; } });
        window.addEventListener('touchend', () => { isDragging = false; });
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2, cy = canvas.height * 0.45, time = Date.now() * 0.001;
            particles.forEach(p => {
                const angle = p.phase + (time * 0.391) + rotationY; let radius, yOffset;
                if (p.vectorGroup < 6) { radius = (1.0 - (p.seed / particleCount)) * (canvas.width * 0.28); yOffset = Math.sin(angle * 2) * 40; ctx.fillStyle = 'rgba(58, 0, 102, 0.7)'; }
                else if (p.vectorGroup < 12) { radius = 4 + Math.sin(time + p.seed) * 8; yOffset = ((p.seed % 30) - 15) * 12; ctx.fillStyle = 'rgba(0, 255, 102, 0.8)'; }
                else { radius = (canvas.width * 0.18) + Math.cos(angle * 0.5) * 60; yOffset = Math.sin(angle) * 34.56; ctx.fillStyle = 'rgba(0, 102, 255, 0.7)'; }
                const sX = cx + Math.cos(angle + (p.vectorGroup * (Math.PI / 9))) * radius, sY = cy + yOffset;
                ctx.beginPath(); ctx.arc(sX, sY, p.vectorGroup < 12 ? 1.5 : 2.5, 0, Math.PI * 2); ctx.fill();
            });
            const sA = time * 0.442 + rotationY, lA = -time * 0.313 + rotationY;
            ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(cx + Math.cos(sA) * (canvas.width * 0.32), cy - 90, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#e5e5e5'; ctx.beginPath(); ctx.arc(cx + Math.cos(lA) * (canvas.width * 0.3), cy - 80, 4, 0, Math.PI * 2); ctx.fill();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
